<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0a84ff">
    <title>Super Tres en Raya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="brand">
                <h1>Super Tres en Raya</h1>
                <div class="subtitle">La estrategia definitiva</div>
            </div>

            <div class="controls">
                <button id="undoBtn" aria-label="Deshacer jugada" disabled>Deshacer</button>
                <button id="menuBtn" aria-label="Abrir Menú Principal">Menú</button>
            </div>
        </header>

        <main class="main">
            <div class="canvasWrap">
                <div id="superBoard" aria-label="Tablero Principal">
                    <!-- Los mini tableros se generan con JS -->
                </div>
            </div>

            <aside class="info" aria-live="polite">
                <div class="scoreRow">
                    <div class="scoreBlock">
                        <div class="label" id="player1Label">Jugador 1 (X)</div>
                        <div id="timer1" class="timer" style="display: none;">--:--</div>
                        <div id="puntuacion1" class="value">0</div>
                    </div>

                    <div class="scoreBlock" style="align-items: center;">
                        <div class="label">Tablas</div>
                        <div id="puntuacionTablas" class="value">0</div>
                    </div>

                    <div class="scoreBlock" style="align-items: flex-end;">
                        <div class="label" id="player2Label">Jugador 2 (O)</div>
                        <div id="timer2" class="timer" style="display: none;">--:--</div>
                        <div id="puntuacion2" class="value">0</div>
                    </div>
                </div>

                <div class="stat">
                    <div class="label">Turno actual</div>
                    <div id="turnoDisplay" class="value" style="color: var(--accent);">Turno de las X</div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Menú Principal Modal -->
    <div id="menuOverlay" class="menu-overlay">
        <div class="menu-card">
            <h2>Configuración</h2>

            <div class="menu-section">
                <h3>Modo de Juego</h3>
                <div class="menu-options" id="optModo">
                    <button class="menu-opt" data-val="pvp">PvP</button>
                    <button class="menu-opt active" data-val="pvia">Vs IA</button>
                </div>
            </div>

            <div class="menu-section" id="secReloj" style="display: none;">
                <h3>Control de Tiempo</h3>
                <div class="menu-options" id="optReloj" style="flex-wrap: wrap;">
                    <button class="menu-opt active" data-val="none" style="flex-basis: 30%;">Sin reloj</button>
                    <button class="menu-opt" data-val="10" style="flex-basis: 30%;">10 min</button>
                    <button class="menu-opt" data-val="5" style="flex-basis: 30%;">5 min</button>
                    <button class="menu-opt" data-val="3+2" style="flex-basis: 45%;">3+2</button>
                    <button class="menu-opt" data-val="2+1" style="flex-basis: 45%;">2+1</button>
                </div>
            </div>

            <div class="menu-section" id="secDificultad">
                <h3>Dificultad de la IA</h3>
                <div class="menu-options" id="optDificultad">
                    <button class="menu-opt" data-val="facil">Fácil</button>
                    <button class="menu-opt active" data-val="medio">Medio</button>
                    <button class="menu-opt" data-val="dificil">Difícil</button>
                </div>
            </div>

            <div class="menu-section" id="secEmpieza">
                <h3>¿Quién empieza?</h3>
                <div class="menu-options" id="optEmpieza">
                    <button class="menu-opt active" data-val="humano">Humano (X)</button>
                    <button class="menu-opt" data-val="ia">IA (X)</button>
                </div>
            </div>

            <button id="startGameBtn" class="start-btn">JUGAR</button>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
