<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0a84ff">
    <title>Super Tres en Raya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="brand">
                <h1>Super Tres en Raya</h1>
                <div class="subtitle">La estrategia definitiva</div>
            </div>

            <div class="controls">
                <select id="modoSelect" aria-label="Seleccionar modo">
                    <option value="pvp">Persona vs Persona</option>
                    <option value="pvia" selected>Persona vs IA</option>
                </select>

                <select id="startSelect" aria-label="Quien empieza">
                    <option value="humano">Empieza: Humano (X)</option>
                    <option value="ia">Empieza: IA (X)</option>
                </select>

                <select id="botLevelSelect" aria-label="Nivel de la IA 1">
                    <option value="facil">IA: Fácil</option>
                    <option value="medio" selected>IA: Medio</option>
                    <option value="dificil">IA: Difícil</option>
                </select>

                <button id="undoBtn" aria-label="Deshacer jugada" disabled>Deshacer</button>
                <button id="resetBtn" aria-label="Reiniciar partida">Reiniciar</button>
            </div>
        </header>

        <main class="main">
            <div class="canvasWrap">
                <div id="superBoard" aria-label="Tablero Principal">
                    <!-- Los mini tableros se generan con JS -->
                </div>
            </div>

            <aside class="info" aria-live="polite">
                <div class="scoreRow">
                    <div class="scoreBlock">
                        <div class="label" id="player1Label">Jugador 1 (X)</div>
                        <div id="puntuacion1" class="value">0</div>
                    </div>

                    <div class="scoreBlock" style="align-items: center;">
                        <div class="label">Tablas</div>
                        <div id="puntuacionTablas" class="value">0</div>
                    </div>

                    <div class="scoreBlock" style="align-items: flex-end;">
                        <div class="label" id="player2Label">Jugador 2 (O)</div>
                        <div id="puntuacion2" class="value">0</div>
                    </div>
                </div>

                <div class="stat">
                    <div class="label">Turno actual</div>
                    <div id="turnoDisplay" class="value" style="color: var(--accent);">Turno de las X</div>
                </div>
            </aside>
        </main>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
